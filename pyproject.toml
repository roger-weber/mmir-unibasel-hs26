[project]
name = "mmir-unibasel-hs26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "amazon-bedrock-haystack>=9.0.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.0",
    "de-core-news-sm",
    "en-core-web-sm",
    "faiss-cpu>=1.9.0",
    "fr-core-news-sm",
    "gensim>=4.4.0",
    "haystack-ai>=3.4.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "kagglehub>=1.0.2",
    "langchain-core>=1.6.5",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.4,<2.5",  # gensim 4.4.0 wheels segfault with numpy 2.5
    "opensearch-py>=3.0.0",
    "pandas>=2.2",
    "psycopg2-binary>=2.9.10",
    "pypdf2>=3.0.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=3.0.0",
    "sentence-transformers-haystack>=1.0.0,<2",
    "spacy>=3.8.16",
    "tabulate>=0.10.0",
    "tiktoken>=0.14.0",
    "torch>=2.2.0",
    "transformers>=5.18.0",
    "unidecode>=1.4.0",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
]

[tool.uv.sources]
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }
