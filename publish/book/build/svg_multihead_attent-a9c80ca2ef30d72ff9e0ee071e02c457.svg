<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Arial, sans-serif" font-size="12">
  <rect width="600" height="380" fill="white"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="14" font-weight="bold">Multi-Head Attention (h heads, each in d/h dimensions)</text>

  <!-- Input -->
  <rect x="220" y="40" width="160" height="30" rx="4" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="300" y="60" text-anchor="middle" font-size="11">x₁, x₂, ..., xₙ  ∈ ℝᵈ</text>

  <!-- Arrows to heads -->
  <line x1="260" y1="70" x2="120" y2="105" stroke="#333" stroke-width="1" marker-end="url(#arr2)"/>
  <line x1="300" y1="70" x2="300" y2="105" stroke="#333" stroke-width="1" marker-end="url(#arr2)"/>
  <line x1="340" y1="70" x2="480" y2="105" stroke="#333" stroke-width="1" marker-end="url(#arr2)"/>

  <!-- Head 1 -->
  <rect x="60" y="110" width="120" height="80" rx="5" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="120" y="130" text-anchor="middle" font-size="11" font-weight="bold">Head 1</text>
  <text x="120" y="148" text-anchor="middle" font-size="10">W_Q¹, W_K¹, W_V¹</text>
  <text x="120" y="165" text-anchor="middle" font-size="10">operates in ℝ^(d/h)</text>
  <text x="120" y="182" text-anchor="middle" font-size="9" fill="#666">e.g. 64 dims</text>

  <!-- Head 2 -->
  <rect x="240" y="110" width="120" height="80" rx="5" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="300" y="130" text-anchor="middle" font-size="11" font-weight="bold">Head 2</text>
  <text x="300" y="148" text-anchor="middle" font-size="10">W_Q², W_K², W_V²</text>
  <text x="300" y="165" text-anchor="middle" font-size="10">operates in ℝ^(d/h)</text>
  <text x="300" y="182" text-anchor="middle" font-size="9" fill="#666">e.g. 64 dims</text>

  <!-- Head h -->
  <rect x="420" y="110" width="120" height="80" rx="5" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="480" y="130" text-anchor="middle" font-size="11" font-weight="bold">Head h</text>
  <text x="480" y="148" text-anchor="middle" font-size="10">W_Qʰ, W_Kʰ, W_Vʰ</text>
  <text x="480" y="165" text-anchor="middle" font-size="10">operates in ℝ^(d/h)</text>
  <text x="480" y="182" text-anchor="middle" font-size="9" fill="#666">e.g. 64 dims</text>

  <!-- Dots between heads -->
  <text x="200" y="155" font-size="16" fill="#666">···</text>
  <text x="380" y="155" font-size="16" fill="#666">···</text>

  <!-- Output from each head -->
  <rect x="75" y="210" width="90" height="25" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="120" y="227" text-anchor="middle" font-size="10">d/h dims</text>

  <rect x="255" y="210" width="90" height="25" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="300" y="227" text-anchor="middle" font-size="10">d/h dims</text>

  <rect x="435" y="210" width="90" height="25" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="480" y="227" text-anchor="middle" font-size="10">d/h dims</text>

  <!-- Arrows down to concat -->
  <line x1="120" y1="235" x2="120" y2="265" stroke="#333" stroke-width="1" marker-end="url(#arr2)"/>
  <line x1="300" y1="235" x2="300" y2="265" stroke="#333" stroke-width="1" marker-end="url(#arr2)"/>
  <line x1="480" y1="235" x2="480" y2="265" stroke="#333" stroke-width="1" marker-end="url(#arr2)"/>

  <!-- Concat box -->
  <rect x="80" y="270" width="440" height="30" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="300" y="290" text-anchor="middle" font-size="11">Concatenate: h × (d/h) = d dimensions</text>

  <!-- Arrow to W_O -->
  <line x1="300" y1="300" x2="300" y2="325" stroke="#333" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="330" y="317" font-size="10" fill="#666">× W_O ∈ ℝ^(d×d)</text>

  <!-- Output -->
  <rect x="220" y="330" width="160" height="30" rx="4" fill="#fff3cd" stroke="#d4a017" stroke-width="2"/>
  <text x="300" y="350" text-anchor="middle" font-size="11" font-weight="bold">z₁, z₂, ..., zₙ  ∈ ℝᵈ</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>
